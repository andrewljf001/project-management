<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>项目公开页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:#071320;color:#dcefff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#06111d,#0d2237);}
.box{width:min(520px,100%);border:1px solid rgba(118,190,255,.22);border-radius:8px;padding:28px;background:rgba(8,24,42,.82);}
.tag{font-size:12px;letter-spacing:.18em;color:#74c0ff;text-transform:uppercase;margin-bottom:14px;}
h1{font-size:24px;margin-bottom:10px;}
p{font-size:14px;line-height:1.8;color:rgba(220,239,255,.66);}
</style>
</head>
<body>
  <main class="box">
    <div class="tag">Public Project Area</div>
    <h1>请选择具体项目公开页</h1>
    <p>此处不展示项目列表。</p>
  </main>
</body>
</html>
