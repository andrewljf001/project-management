<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MROCIOA · 项目管理看板</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:#020d1a;}
.dash{
  background:linear-gradient(135deg,#020d1a 0%,#041628 50%,#020f1e 100%);
  color:#e0f4ff;
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}
.dash::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% -10%,rgba(0,180,255,0.08) 0%,transparent 70%),
    radial-gradient(ellipse 30% 50% at 90% 50%,rgba(0,100,255,0.05) 0%,transparent 60%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,180,255,0.03) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,180,255,0.03) 40px);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:16px;
  border-bottom:1px solid rgba(0,180,255,0.2);
  margin-bottom:16px;
}
.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;font-size:22px;
  color:#00c8ff;letter-spacing:4px;
  text-shadow:0 0 24px rgba(0,200,255,0.5);
}
.logo span{color:#fff;font-weight:400;}
.logo-sub{font-size:11px;color:rgba(0,200,255,0.4);letter-spacing:3px;margin-top:4px;}
.clock{
  font-family:'Orbitron',monospace;font-size:18px;
  color:#00c8ff;letter-spacing:3px;
  text-shadow:0 0 10px rgba(0,200,255,0.4);
}
.clock-sub{font-size:10px;color:rgba(0,200,255,0.4);margin-top:4px;text-align:right;letter-spacing:2px;}
.status-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#00ff88;margin-right:6px;
  box-shadow:0 0 8px #00ff88;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

.row{display:grid;gap:14px;margin-bottom:14px;}
.row-4{grid-template-columns:repeat(4,1fr);}
.row-3-2{grid-template-columns:2fr 1fr 1fr;}
@media(max-width:900px){
  .row-4{grid-template-columns:repeat(2,1fr);}
  .row-3-2{grid-template-columns:1fr;}
}

.card{
  background:rgba(4,22,48,0.85);
  border:1px solid rgba(0,180,255,0.2);
  border-radius:8px;padding:16px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(6px);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,0.5),transparent);
}
.card-title{
  font-size:10px;letter-spacing:2px;color:rgba(0,200,255,0.55);
  text-transform:uppercase;margin-bottom:10px;
}

.stat-val{font-family:'Orbitron',monospace;font-size:34px;font-weight:700;color:#fff;line-height:1;}
.stat-val.blue{color:#00c8ff;text-shadow:0 0 16px rgba(0,200,255,0.4);}
.stat-val.green{color:#00ff88;text-shadow:0 0 16px rgba(0,255,136,0.4);}
.stat-val.amber{color:#ffa000;}
.stat-sub{font-size:10px;color:rgba(160,220,255,0.4);margin-top:6px;letter-spacing:1px;}

.globe-area{display:flex;align-items:center;justify-content:center;height:140px;position:relative;margin:8px 0;}
.globe{
  width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#1e7fcb,#0a3a80 50%,#041428);
  border:1px solid rgba(0,180,255,0.5);
  box-shadow:0 0 40px rgba(0,140,255,0.25),inset 0 0 30px rgba(0,60,140,0.5);
  position:relative;z-index:2;
}
.ring{
  position:absolute;border-radius:50%;border:1px solid rgba(0,200,255,0.2);
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.ring1{width:114px;height:114px;animation:spin 8s linear infinite;}
.ring2{width:134px;height:134px;animation:spin 12s linear infinite reverse;border-color:rgba(0,200,255,0.12);}
.ring3{width:154px;height:154px;animation:spin 18s linear infinite;border-color:rgba(0,200,255,0.06);}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}

.proj-item{
  background:rgba(0,18,45,0.6);
  border:1px solid rgba(0,180,255,0.12);
  border-radius:6px;padding:12px 14px;margin-bottom:10px;
}
.proj-item:last-child{margin-bottom:0;}
.badge{display:inline-block;font-size:9px;letter-spacing:1px;padding:2px 10px;border-radius:2px;margin-bottom:8px;}
.badge-active{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.25);}
.badge-planning{background:rgba(0,200,255,0.1);color:#00c8ff;border:1px solid rgba(0,200,255,0.25);}
.badge-paused{background:rgba(255,160,0,0.1);color:#ffa000;border:1px solid rgba(255,160,0,0.25);}
.badge-archived{background:rgba(100,100,100,0.1);color:#888;border:1px solid rgba(100,100,100,0.25);}
.proj-name{font-size:13px;font-weight:bold;color:#e0f4ff;margin-bottom:3px;}
.proj-desc{font-size:10px;color:rgba(160,220,255,0.45);margin-bottom:8px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.pbar{flex:1;height:4px;background:rgba(0,60,120,0.5);border-radius:2px;overflow:hidden;}
.pfill{height:100%;border-radius:2px;background:linear-gradient(90deg,#0060b8,#00c8ff);box-shadow:0 0 6px rgba(0,200,255,0.4);}
.ppct{font-size:10px;color:#00c8ff;min-width:30px;text-align:right;}
.proj-phase{font-size:9px;color:rgba(0,200,255,0.35);margin-top:6px;}

.bars{display:flex;align-items:flex-end;gap:8px;height:90px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.bar{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(0deg,rgba(0,90,180,0.5),rgba(0,200,255,0.85));box-shadow:0 0 8px rgba(0,200,255,0.3);}
.bar-lbl{font-size:9px;color:rgba(160,220,255,0.4);}

.pie-wrap{position:relative;width:90px;height:90px;margin:0 auto;}
.pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;}
.pie-sub{font-size:9px;color:rgba(0,200,255,0.5);}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(160,220,255,0.65);}
.leg-dot{width:9px;height:9px;border-radius:50%;}

.task-item{background:rgba(0,18,45,0.45);border-left:2px solid rgba(0,180,255,0.3);border-radius:0 4px 4px 0;padding:6px 10px;font-size:11px;color:rgba(200,235,255,0.75);margin-bottom:5px;}
.task-item:last-child{margin-bottom:0;}

.scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.25),transparent);animation:scan 5s ease-in-out infinite;pointer-events:none;z-index:999;}
@keyframes scan{0%{top:0;opacity:0;}5%{opacity:1;}95%{opacity:0.3;}100%{top:100%;opacity:0;}}

.footer{text-align:center;margin-top:16px;font-size:9px;color:rgba(0,200,255,0.2);letter-spacing:3px;padding-top:12px;border-top:1px solid rgba(0,180,255,0.08);}
</style>
</head>
<body>
<div class="dash">
<div class="scan-line"></div>
<div class="wrap">

  <div class="header">
    <div>
      <div class="logo">MROCIOA<span> · PM</span></div>
      <div class="logo-sub">PROJECT MANAGEMENT DASHBOARD</div>
    </div>
    <div style="text-align:right">
      <div class="clock" id="clk">--:--:--</div>
      <div class="clock-sub"><span class="status-dot"></span>SYSTEM ONLINE · <span id="today-date"></span></div>
    </div>
  </div>

  <div class="row row-4">
    <div class="card" style="text-align:center">
      <div class="card-title">总项目数</div>
      <div class="stat-val blue" id="s-total">-</div>
      <div class="stat-sub">TOTAL PROJECTS</div>
    </div>
    <div class="card" style="text-align:center">
      <div class="card-title">进行中</div>
      <div class="stat-val green" id="s-active">-</div>
      <div class="stat-sub">ACTIVE</div>
    </div>
    <div class="card" style="text-align:center">
      <div class="card-title">规划中</div>
      <div class="stat-val amber" id="s-planning">-</div>
      <div class="stat-sub">PLANNING</div>
    </div>
    <div class="card" style="text-align:center">
      <div class="card-title">完成任务</div>
      <div class="stat-val blue" id="s-done">-</div>
      <div class="stat-sub">COMPLETED TASKS</div>
    </div>
  </div>

  <div class="row row-3-2">
    <div class="card">
      <div class="card-title">项目进度 · PROJECT STATUS</div>
      <div id="proj-list"></div>
    </div>

    <div class="card">
      <div class="card-title">全局节点 · GLOBAL NODE</div>
      <div class="globe-area">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
        <div class="globe"></div>
      </div>
      <div class="pie-wrap">
        <svg id="pie-svg" viewBox="0 0 90 90" style="width:90px;height:90px;"></svg>
        <div class="pie-center">
          <span id="pie-total">-</span>
          <span class="pie-sub">PROJ</span>
        </div>
      </div>
      <div class="legend" id="pie-legend"></div>
    </div>

    <div class="card">
      <div class="card-title">周活动 · WEEKLY COMMITS</div>
      <div class="bars" id="bars"></div>
      <div style="font-size:10px;color:rgba(0,200,255,0.4);text-align:center;margin-top:8px;">本周 Commit 趋势</div>
      <div style="margin-top:14px;border-top:1px solid rgba(0,180,255,0.1);padding-top:12px;">
        <div class="card-title">优先待办 · PENDING</div>
        <div id="task-list"></div>
      </div>
    </div>
  </div>

  <div class="footer" id="footer">LAST SYNC: -- · andrewljf001 · MROCIOA-PM v1.0</div>
</div>
</div>

<script>
function tick(){
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  document.getElementById('today-date').textContent=n.toISOString().slice(0,10);
}
tick();setInterval(tick,1000);

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(render).catch(e=>console.warn('data.json missing',e));

function render(d){
  // 全部从 projects 数组自动计算，不依赖 summary 字段
  const projects = d.projects || [];
  const total    = projects.length;
  const activeN  = projects.filter(p => p.status === 'active').length;
  const planN    = projects.filter(p => p.status === 'planning').length;
  const pausedN  = projects.filter(p => p.status === 'paused').length;
  const allDone  = projects.reduce((a, p) => a + (p.completedTasks || 0), 0);

  document.getElementById('s-total').textContent   = total;
  document.getElementById('s-active').textContent  = activeN;
  document.getElementById('s-planning').textContent= planN;
  document.getElementById('s-done').textContent    = allDone;
  document.getElementById('footer').textContent    = 'LAST SYNC: '+(d.lastUpdated||'--').slice(0,10)+' · andrewljf001 · MROCIOA-PM v1.0';

  // 项目列表（归档项目排最后）
  const pl = document.getElementById('proj-list');
  pl.innerHTML = '';
  const sorted = [...projects].sort((a,b)=>{
    const order = {active:0, planning:1, paused:2, archived:3};
    return (order[a.status]??9) - (order[b.status]??9);
  });
  sorted.forEach(p => {
    const bc = {active:'badge-active', planning:'badge-planning', paused:'badge-paused', archived:'badge-archived'}[p.status] || 'badge-planning';
    const bt = {active:'● ACTIVE', planning:'◌ PLANNING', paused:'⏸ PAUSED', archived:'■ ARCHIVED'}[p.status] || p.status.toUpperCase();
    const pct = p.progress || 0;
    pl.innerHTML += `<div class="proj-item">
      <span class="badge ${bc}">${bt}</span>
      <div class="proj-name">${p.name}</div>
      <div class="proj-desc">${p.description||''}</div>
      <div class="progress-row">
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div class="ppct">${pct}%</div>
      </div>
      <div class="proj-phase">▷ ${p.currentPhase||''}</div>
    </div>`;
  });

  // 饼图（只统计非归档项目）
  const activeProjects = projects.filter(p => p.status !== 'archived');
  const pieTotal = activeProjects.length || 1;
  const svg = document.getElementById('pie-svg');
  const cx=45,cy=45,r=30,circ=2*Math.PI*r;
  const segs = [
    {val: activeN,  color:'#00c8ff', label:'Active'},
    {val: planN,    color:'#ffa000', label:'Planning'},
    {val: pausedN,  color:'#ff4444', label:'Paused'},
  ].filter(s => s.val > 0);
  let offset = 0;
  let paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,60,120,0.4)" stroke-width="14"/>`;
  segs.forEach(seg => {
    const frac = seg.val / pieTotal, dash = frac * circ;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="14" stroke-dasharray="${dash.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  svg.innerHTML = paths;
  document.getElementById('pie-total').textContent = pieTotal;
  document.getElementById('pie-legend').innerHTML = segs.map(s =>
    `<div class="leg-item"><div class="leg-dot" style="background:${s.color}"></div>${s.label} ${Math.round(s.val/pieTotal*100)}%</div>`
  ).join('');

  // 周活动柱状图
  const wa = d.weeklyActivity || [];
  const maxC = Math.max(...wa.map(w => w.commits), 1);
  document.getElementById('bars').innerHTML = wa.map(w =>
    `<div class="bar-col"><div class="bar" style="height:${Math.max(w.commits/maxC*70,2).toFixed(0)}px" title="${w.commits} commits"></div><div class="bar-lbl">${w.day}</div></div>`
  ).join('');

  // 待办列表（只显示非归档项目的待办）
  const tl = document.getElementById('task-list');
  tl.innerHTML = '';
  const allP = [];
  projects.filter(p => p.status !== 'archived').forEach(p => (p.pendingItems||[]).forEach(t => allP.push(t)));
  allP.slice(0,6).forEach(t => { tl.innerHTML += `<div class="task-item">${t}</div>`; });
}
</script>
</body>
</html>
