<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>项目管控中心</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:#05111f;color:#d9ecff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
body{display:grid;place-items:center;padding:24px;background:
  radial-gradient(circle at 50% 0%,rgba(0,153,255,.16),transparent 34rem),
  linear-gradient(135deg,#03101d,#081a2d 54%,#041120);
}
.panel{width:min(560px,100%);border:1px solid rgba(105,182,255,.24);background:rgba(5,18,34,.82);border-radius:8px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28);}
.kicker{font-size:12px;letter-spacing:.18em;color:#6dbdff;text-transform:uppercase;margin-bottom:16px;}
h1{font-size:24px;line-height:1.25;margin-bottom:10px;font-weight:700;}
p{font-size:14px;line-height:1.8;color:rgba(217,236,255,.68);}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 12px;border:1px solid rgba(105,182,255,.22);border-radius:6px;color:#9fd0ff;font-size:13px;}
.dot{width:8px;height:8px;border-radius:50%;background:#25d990;box-shadow:0 0 14px rgba(37,217,144,.7);}
</style>
</head>
<body>
  <main class="panel">
    <div class="kicker">Private Control Center</div>
    <h1>项目总控不在公开入口展示</h1>
    <p>当前路径只保留为管控中心占位页。对外协作请使用单个项目的公开分享链接。</p>
    <div class="status"><span class="dot"></span>ACCESS LIMITED</div>
  </main>
</body>
</html>
