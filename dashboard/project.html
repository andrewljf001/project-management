<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MROCIOA · 项目详情</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;background:#020d1a;}
.dash{
  background:linear-gradient(135deg,#020d1a 0%,#041628 50%,#020f1e 100%);
  color:#e0f4ff;
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}
.dash::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 50% -10%,rgba(0,180,255,0.08) 0%,transparent 70%),
    radial-gradient(ellipse 30% 50% at 90% 50%,rgba(0,100,255,0.05) 0%,transparent 60%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,180,255,0.03) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,180,255,0.03) 40px);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid rgba(0,180,255,0.2);margin-bottom:20px;}
.logo{font-family:'Orbitron',monospace;font-weight:900;font-size:20px;color:#00c8ff;letter-spacing:4px;text-shadow:0 0 24px rgba(0,200,255,0.5);}
.logo span{color:#fff;font-weight:400;}
.logo-sub{font-size:10px;color:rgba(0,200,255,0.4);letter-spacing:3px;margin-top:4px;}
.clock{font-family:'Orbitron',monospace;font-size:16px;color:#00c8ff;letter-spacing:3px;text-shadow:0 0 10px rgba(0,200,255,0.4);}
.clock-sub{font-size:10px;color:rgba(0,200,255,0.4);margin-top:4px;text-align:right;letter-spacing:2px;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00ff88;margin-right:6px;box-shadow:0 0 8px #00ff88;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* public marker */
.public-marker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;color:rgba(0,200,255,0.5);letter-spacing:2px;
  margin-bottom:20px;
  padding:6px 14px;border:1px solid rgba(0,180,255,0.15);border-radius:4px;
}
.public-marker::before{content:'◇';color:#00c8ff;}

/* card */
.card{background:rgba(4,22,48,0.85);border:1px solid rgba(0,180,255,0.2);border-radius:8px;padding:20px;position:relative;overflow:hidden;backdrop-filter:blur(6px);margin-bottom:14px;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.5),transparent);}
.card-title{font-size:10px;letter-spacing:2px;color:rgba(0,200,255,0.55);text-transform:uppercase;margin-bottom:14px;}

/* project hero */
.proj-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.proj-hero-left{flex:1;min-width:200px;}
.badge{display:inline-block;font-size:9px;letter-spacing:1px;padding:3px 12px;border-radius:2px;margin-bottom:10px;}
.badge-active{background:rgba(0,255,136,0.1);color:#00ff88;border:1px solid rgba(0,255,136,0.25);}
.badge-planning{background:rgba(0,200,255,0.1);color:#00c8ff;border:1px solid rgba(0,200,255,0.25);}
.badge-paused{background:rgba(255,160,0,0.1);color:#ffa000;border:1px solid rgba(255,160,0,0.25);}
.badge-archived{background:rgba(100,100,100,0.1);color:#888;border:1px solid rgba(100,100,100,0.25);}
.proj-title{font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:2px;}
.proj-desc{font-size:11px;color:rgba(160,220,255,0.5);line-height:1.6;margin-bottom:14px;}
.proj-phase{font-size:10px;color:rgba(0,200,255,0.45);letter-spacing:1px;}
.proj-phase span{color:#00c8ff;}

/* progress big */
.prog-big{min-width:160px;text-align:center;}
.prog-circle{position:relative;width:120px;height:120px;margin:0 auto 10px;}
.prog-circle svg{transform:rotate(-90deg);}
.prog-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:26px;font-weight:700;color:#00c8ff;text-shadow:0 0 16px rgba(0,200,255,0.4);}
.prog-label{font-size:10px;color:rgba(0,200,255,0.4);letter-spacing:2px;}

/* stats row */
.stats-row{display:flex;gap:12px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:100px;background:rgba(0,14,36,0.5);border:1px solid rgba(0,180,255,0.1);border-radius:6px;padding:12px;text-align:center;}
.stat-num{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:#00c8ff;text-shadow:0 0 12px rgba(0,200,255,0.3);}
.stat-lbl{font-size:9px;color:rgba(160,220,255,0.4);letter-spacing:1px;margin-top:4px;}

/* milestones */
.ms-list{display:flex;flex-direction:column;gap:10px;}
.ms-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,14,36,0.45);border-radius:5px;border:1px solid rgba(0,180,255,0.08);}
.ms-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.ms-dot.done{background:#00ff88;box-shadow:0 0 6px #00ff88;}
.ms-dot.active{background:#00c8ff;box-shadow:0 0 6px #00c8ff;animation:pulse 2s ease-in-out infinite;}
.ms-dot.partial{background:#ffa000;box-shadow:0 0 6px rgba(255,160,0,0.4);}
.ms-dot.pending{background:rgba(60,100,160,0.4);border:1px solid rgba(0,180,255,0.2);}
.ms-name{flex:1;font-size:12px;color:rgba(200,235,255,0.75);}
.ms-target{font-size:10px;color:rgba(0,200,255,0.3);white-space:nowrap;}
.ms-status-label{font-size:9px;padding:2px 8px;border-radius:2px;white-space:nowrap;}
.ms-status-label.done{background:rgba(0,255,136,0.08);color:#00ff88;}
.ms-status-label.active{background:rgba(0,200,255,0.08);color:#00c8ff;}
.ms-status-label.partial{background:rgba(255,160,0,0.08);color:#ffa000;}
.ms-status-label.pending{background:rgba(60,100,160,0.08);color:rgba(160,200,255,0.4);}

/* tasks */
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:600px){.task-grid{grid-template-columns:1fr;}}
.task-item{background:rgba(0,14,36,0.5);border-left:2px solid rgba(0,180,255,0.25);border-radius:0 4px 4px 0;padding:8px 12px;font-size:11px;color:rgba(180,225,255,0.65);line-height:1.5;}
.task-item.recurring{border-left-color:rgba(0,255,136,0.3);color:rgba(180,255,210,0.6);}

/* repo link */
.repo-link{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:rgba(0,200,255,0.4);letter-spacing:1px;text-decoration:none;padding:5px 12px;border:1px solid rgba(0,180,255,0.15);border-radius:4px;transition:color .2s,border-color .2s;}
.repo-link:hover{color:#00c8ff;border-color:rgba(0,200,255,0.4);}

.scan-line{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,200,255,0.25),transparent);animation:scan 5s ease-in-out infinite;pointer-events:none;z-index:999;}
@keyframes scan{0%{top:0;opacity:0;}5%{opacity:1;}95%{opacity:0.3;}100%{top:100%;opacity:0;}}
.footer{text-align:center;margin-top:16px;font-size:9px;color:rgba(0,200,255,0.2);letter-spacing:3px;padding-top:12px;border-top:1px solid rgba(0,180,255,0.08);}

.not-found{text-align:center;padding:80px 20px;color:rgba(0,200,255,0.3);font-size:14px;letter-spacing:2px;}
</style>
</head>
<body>
<div class="dash">
<div class="scan-line"></div>
<div class="wrap">

  <div class="header">
    <div>
      <div class="logo">MROCIOA<span> · PM</span></div>
      <div class="logo-sub">PROJECT DETAIL</div>
    </div>
    <div style="text-align:right">
      <div class="clock" id="clk">--:--:--</div>
      <div class="clock-sub"><span class="status-dot"></span>SYSTEM ONLINE · <span id="today-date"></span></div>
    </div>
  </div>

  <div class="public-marker">项目公开页 · PUBLIC VIEW</div>

  <div id="content"></div>

  <div class="footer">andrewljf001 · MROCIOA-PM v1.0</div>
</div>
</div>

<script>
function tick(){
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  document.getElementById('clk').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
  document.getElementById('today-date').textContent=n.toISOString().slice(0,10);
}
tick();setInterval(tick,1000);

const id=new URLSearchParams(location.search).get('id');
if(!id){
  document.getElementById('content').innerHTML='<div class="not-found">PROJECT ID MISSING</div>';
}else{
  loadProject(id).then(p=>{
  if(!p){document.getElementById('content').innerHTML='<div class="not-found">PROJECT NOT FOUND · '+id+'</div>';return;}
  render(p);
  }).catch(()=>{document.getElementById('content').innerHTML='<div class="not-found">FAILED TO LOAD PROJECT DATA</div>';});
}

function loadProject(projectId){
  // Detail pages load only one public project payload, not the full dashboard dataset.
  return fetch('./public/'+encodeURIComponent(projectId)+'.json?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(payload=>payload?(payload.project||payload):null);
}

function msClass(s){return {done:'done',active:'active',partial:'partial',pending:'pending'}[s]||'pending';}
function msLabel(s){return {done:'DONE',active:'IN PROGRESS',partial:'PARTIAL',pending:'PENDING'}[s]||s.toUpperCase();}
function badgeClass(s){return {active:'badge-active',planning:'badge-planning',paused:'badge-paused',archived:'badge-archived'}[s]||'badge-planning';}
function badgeText(s){return {active:'● ACTIVE',planning:'◌ PLANNING',paused:'⏸ PAUSED',archived:'■ ARCHIVED'}[s]||s.toUpperCase();}

function render(p){
  const pct=p.progress||0;
  const r=52,circ=2*Math.PI*r;
  const fill=(pct/100*circ).toFixed(2);
  const openT=p.openTasks||0;
  const doneT=p.completedTasks||0;
  const totalT=openT+doneT;

  let html=`
  <!-- Hero -->
  <div class="card">
    <div class="proj-hero">
      <div class="proj-hero-left">
        <span class="badge ${badgeClass(p.status)}">${badgeText(p.status)}</span>
        <div class="proj-title">${p.name}</div>
        <div class="proj-desc">${p.description||''}</div>
        <div class="proj-phase">▷ 当前阶段：<span>${p.currentPhase||'—'}</span></div>
        <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          ${p.repo?`<a class="repo-link" href="https://github.com/${p.repo}" target="_blank">⎇ ${p.repo}</a>`:''}
          <span style="font-size:10px;color:rgba(0,200,255,0.3);">最后活动：${p.lastActivity||'—'}</span>
        </div>
      </div>
      <div class="prog-big">
        <div class="prog-circle">
          <svg viewBox="0 0 120 120" width="120" height="120">
            <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(0,60,120,0.4)" stroke-width="10"/>
            <circle cx="60" cy="60" r="${r}" fill="none" stroke="#00c8ff" stroke-width="10"
              stroke-dasharray="${fill} ${circ.toFixed(2)}"
              stroke-linecap="round"
              style="filter:drop-shadow(0 0 6px rgba(0,200,255,0.5));"/>
          </svg>
          <div class="prog-num">${pct}%</div>
        </div>
        <div class="prog-label">PROGRESS</div>
      </div>
    </div>
  </div>

  <!-- 统计 -->
  <div class="card">
    <div class="card-title">任务统计 · TASK STATS</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num">${totalT}</div>
        <div class="stat-lbl">TOTAL</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:#ffa000;">${openT}</div>
        <div class="stat-lbl">OPEN</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:#00ff88;">${doneT}</div>
        <div class="stat-lbl">DONE</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">${totalT>0?Math.round(doneT/totalT*100):0}%</div>
        <div class="stat-lbl">COMPLETE</div>
      </div>
    </div>
  </div>`;

  // Milestones
  if((p.milestones||[]).length){
    html+=`<div class="card"><div class="card-title">里程碑 · MILESTONES</div><div class="ms-list">`;
    p.milestones.forEach(m=>{
      const cls=msClass(m.status);
      html+=`<div class="ms-row">
        <div class="ms-dot ${cls}"></div>
        <div class="ms-name">${m.name}</div>
        ${m.target?`<div class="ms-target">${m.target}</div>`:''}
        <span class="ms-status-label ${cls}">${msLabel(m.status)}</span>
      </div>`;
    });
    html+=`</div></div>`;
  }

  // 待办事项
  if((p.pendingItems||[]).length){
    html+=`<div class="card"><div class="card-title">待办事项 · PENDING TASKS</div><div class="task-grid">`;
    p.pendingItems.forEach(t=>{html+=`<div class="task-item">▸ ${t}</div>`;});
    html+=`</div></div>`;
  }

  // 周期任务
  if((p.recurringTasks||[]).length){
    html+=`<div class="card"><div class="card-title">周期任务 · RECURRING</div><div class="task-grid">`;
    p.recurringTasks.forEach(t=>{html+=`<div class="task-item recurring">↻ ${t}</div>`;});
    html+=`</div></div>`;
  }

  document.getElementById('content').innerHTML=html;
  document.title='MROCIOA · '+p.name;
}
</script>
</body>
</html>
